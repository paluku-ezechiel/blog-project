<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
  </head>
  <body>
    <div class="container">
      <header>
        <a href="../index.html" class="header-brand">Blog</a>
        <ul>
          <li><a href="../index.html" class="header-nav active">Accueil</a></li>
          <li>
            <a href="../form/form.html" class="header-nav">Créer un article</a>
          </li>
        </ul>
      </header>
      <div class="content">
        <form>
          <h2 class="title-underline">Ajouter un article</h2>
          <div class="form-group">
            <label for="author">Auteur</label>
            <input id="author" type="text" name="author" required/>
          </div>

          <div class="form-group">
            <label for="img">Image de profil</label>
            <input id="img" type="url" name="img" required/>
          </div>

          <div class="form-group">
            <label for="category">Catégorie</label>
            <input id="category" type="text" name="category" required />
          </div>

          <div class="form-group">
            <label for="title">Titre</label>
            <input id="title" type="text" name="title" required />
          </div>


          <div class="form-group">
            <label for="content">Article</label>
            <textarea id="content" name="content" required></textarea>
          </div>
          <ul id="errors" class="text-error" aria-live="polite" aria-atomic="true"></ul>
          <div class="form-btn-container">
            <button class="btn btn-secondary">Annuler</button>
            <button class="btn btn-primay">Sauvegarder</button>
          </div>
        </form>
      </div>
      <footer>© Blog</footer>
    </div>
    <script type="module" src="../form/form.js"></script>
  </body>
</html>
